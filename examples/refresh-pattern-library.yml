# Copy to .github/workflows/refresh-pattern-library.yml in a consuming project.
#
# Requires two repository secrets, created by `wp pattern-library setup` on the
# site you capture from:
#
#   PATTERN_LIBRARY_WP_USER
#   PATTERN_LIBRARY_WP_APP_PASSWORD
#
# ...and a repository variable PATTERN_LIBRARY_SITE holding the site origin.
#
# If the site sits behind Cloudflare Access, add a service token as two more
# secrets and uncomment the extra-headers input below:
#
#   CF_ACCESS_CLIENT_ID
#   CF_ACCESS_CLIENT_SECRET

name: Refresh pattern library

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Branch to open the pull request against.
        required: true
        default: main
      output_path:
        description: Directory to write the pattern library into.
        required: true
        default: docs/pattern-library
      site_url:
        description: Site to capture from. Defaults to the PATTERN_LIBRARY_SITE variable.
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Ships Chromium and its system dependencies preinstalled, which saves a
    # minute or so of apt traffic on every run.
    container: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_branch }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the pattern library
        uses: humanmade/wp-pattern-library@v0.2.0
        with:
          site-url: ${{ inputs.site_url || vars.PATTERN_LIBRARY_SITE }}
          username: ${{ secrets.PATTERN_LIBRARY_WP_USER }}
          app-password: ${{ secrets.PATTERN_LIBRARY_WP_APP_PASSWORD }}
          output-path: ${{ inputs.output_path }}
          # extra-headers: |
          #   CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          #   CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v8
        with:
          base: ${{ inputs.base_branch }}
          branch: pattern-library/refresh
          title: Refresh the pattern library
          commit-message: Refresh the pattern library
          body: |
            Regenerated from `${{ inputs.site_url || vars.PATTERN_LIBRARY_SITE }}`.

            Screenshots reflect the code deployed to that site, so patterns added
            on this branch but not yet released will show as "preview pending".
          add-paths: ${{ inputs.output_path }}
          delete-branch: true
